services:
  db:
    image: postgis/postgis:16-3.4
    container_name: cabsathi-db
    environment:
      POSTGRES_USER: cabsathi
      POSTGRES_PASSWORD: cabsathi
      POSTGRES_DB: cabsathi
    ports:
      - "5433:5432"
    volumes:
      - cabsathi-db:/var/lib/postgresql/data
volumes:
  cabsathi-db:
